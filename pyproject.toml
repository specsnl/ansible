[project]
name = "ansible-env"
version = "0.1.0"
requires-python = ">=3.14"
# SemVer dependencies are capped at the current major, CalVer tooling gets a floor
# only (its major is the year). Run `task deps:update` to refresh both.
dependencies = [
    # for better Ansible password_hash() support
    "passlib>=1.7.4,<2",
    "bcrypt>=5.0.0,<6",
    # openshift is a requirement of the k8s Ansible module
    "openshift>=0.13.2,<0.14",
    # needed for Ansible k8s module's validate support
    "kubernetes-validate>=1.36.0,<2",
    # needed for Ansible dns lookup support
    "dnspython>=2.8.0,<3",
    # needed for Ansible ipaddr functions
    "netaddr>=1.3.0,<2",
    # needed for Ansible hashi_vault plugin support
    "hvac>=2.4.0,<3",
    # needed for Ansible docker
    "docker>=7.2.0,<8",
    # misc tooling
    "ansible-lint>=26.6.0",
    "yamllint>=1.38.0",
    "molecule>=26.6.0",
    "molecule-plugins[docker]>=26.7.15",
    "antsibull-changelog>=0.35.1",
    "ansible>=14.2.0,<15",
]
