version: "3"

silent: true

vars:
  DOCKER_REPO: ghcr.io
  DOCKER_OWNER: specsnl
  DOCKER_IMAGE_NAME: ansible
  # Latatest version of Hadolint: https://hub.docker.com/r/hadolint/hadolint/tags or https://github.com/hadolint/hadolint/releases
  HADOLINT_TAG_VERSION: "v2.15.1"
  # Latatest version of utils: https://github.com/specsnl/utils/releases/latest
  UTILS_TAG_VERSION: "1.12.0"
  # laest version of UV: https://hub.docker.com/r/astral/uv/tags
  UV_TAG_VERSION: "0.12.2-python3.14-alpine3.23"

includes:
  scripts:
    taskfile: ./scripts
    dir: ./scripts

# env:
#   BUILDKIT_PROGRESS: plain

tasks:
  build:
    desc: Build both ansible and k8s images
    deps:
      - build:ansible
      - build:k8s

  build:ansible:
    desc: Build the ansible image
    cmds:
      - docker build
        --tag {{.DOCKER_REPO}}/{{.DOCKER_OWNER}}/{{.DOCKER_IMAGE_NAME}}:latest
        --target ansible
        .

  build:k8s:
    desc: Build the k8s image
    cmds:
      - docker build
        --tag {{.DOCKER_REPO}}/{{.DOCKER_OWNER}}/{{.DOCKER_IMAGE_NAME}}/k8s:latest
        --target k8s
        .

  deps:upgrade:
    desc: Update uv.lock (upgrade all dependencies to their latest allowed versions)
    cmds:
      - docker run --rm
        --workdir /workspace
        --volume $(pwd):/workspace
        astral/uv:{{.UV_TAG_VERSION}}
        uv lock --upgrade

  deps:update:
    desc: Update pyproject.toml (upgrade dependencies past their bounds and rewrite them)
    cmds:
      # SemVer dependencies: cap at the new major
      - docker run --rm
        --workdir /workspace
        --volume $(pwd):/workspace
        astral/uv:{{.UV_TAG_VERSION}}
        uv add --no-sync --upgrade --bounds major
        passlib
        bcrypt
        openshift
        kubernetes-validate
        dnspython
        netaddr
        hvac
        docker
        ansible
      # CalVer tooling: floor only, capping on the major would expire every January
      - docker run --rm
        --workdir /workspace
        --volume $(pwd):/workspace
        astral/uv:{{.UV_TAG_VERSION}}
        uv add --no-sync --upgrade --bounds lower
        ansible-lint
        yamllint
        molecule
        'molecule-plugins[docker]'
        antsibull-changelog

  lint:
    desc: Apply a Dockerfile linter (https://github.com/hadolint/hadolint)
    cmds:
      - docker run
        --interactive
        --rm
        --volume $(pwd)/.hadolint.yml:/.hadolint.yml
        hadolint/hadolint:{{.HADOLINT_TAG_VERSION}}
        hadolint
        -
        < Dockerfile

  shell:
    desc: Interactive shell with Ansible
    interactive: true
    cmds:
      - docker run
        --interactive
        --tty
        --rm
        --user $(id -u):$(id -g)
        --volume $(pwd):/workspace
        --env ANSIBLE_CONFIG="/workspace/ansible"
        {{.DOCKER_REPO}}/{{.DOCKER_OWNER}}/{{.DOCKER_IMAGE_NAME}}:latest
        /bin/bash
